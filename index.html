<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', 'Figtree', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0a0a0a;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  height: 100vh;
}

/* ===== NOISE TEXTURE OVERLAY ===== */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 999;
  pointer-events: none;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 200px 200px;
}

/* ===== VIGNETTE EFFECT ===== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
}

/* ===== FLOATING PARTICLES ===== */
.floating-dot {
  position: fixed;
  width: 3px;
  height: 3px;
  background: rgba(255,255,255,0.12);
  border-radius: 50%;
  z-index: 1;
  pointer-events: none;
}
.floating-dot:nth-child(1) {
  top: 18%; left: 12%;
  animation: floatDot1 18s ease-in-out infinite;
}
.floating-dot:nth-child(2) {
  top: 72%; left: 85%;
  width: 2px; height: 2px;
  animation: floatDot2 22s ease-in-out infinite;
  opacity: 0.7;
}
.floating-dot:nth-child(3) {
  top: 35%; left: 78%;
  width: 4px; height: 4px;
  background: rgba(255,255,255,0.06);
  animation: floatDot3 25s ease-in-out infinite;
}
.floating-dot:nth-child(4) {
  top: 82%; left: 22%;
  width: 2px; height: 2px;
  animation: floatDot4 20s ease-in-out infinite;
  opacity: 0.5;
}
.floating-dot:nth-child(5) {
  top: 55%; left: 45%;
  width: 3px; height: 3px;
  background: rgba(255,255,255,0.08);
  animation: floatDot5 28s ease-in-out infinite;
}
.floating-dot:nth-child(6) {
  top: 10%; left: 60%;
  width: 2px; height: 2px;
  animation: floatDot6 24s ease-in-out infinite;
  opacity: 0.6;
}
@keyframes floatDot1 {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(30px, -20px); }
  50% { transform: translate(-15px, 35px); }
  75% { transform: translate(20px, 15px); }
}
@keyframes floatDot2 {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-25px, 18px); }
  50% { transform: translate(20px, -30px); }
  75% { transform: translate(-10px, -12px); }
}
@keyframes floatDot3 {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(-35px, -25px); }
  66% { transform: translate(15px, 30px); }
}
@keyframes floatDot4 {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(18px, -28px); }
  50% { transform: translate(-22px, -10px); }
  75% { transform: translate(12px, 22px); }
}
@keyframes floatDot5 {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(25px, 20px); }
  66% { transform: translate(-20px, -15px); }
}
@keyframes floatDot6 {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-15px, 25px); }
  50% { transform: translate(28px, 10px); }
  75% { transform: translate(-8px, -20px); }
}

/* ===== NAV ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 28px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-logo img {
  height: 26px;
  filter: brightness(0) invert(1);
  opacity: 0.9;
}
.nav-menu-btn {
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.nav-menu-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.25);
}
.nav-menu-btn svg {
  width: 18px; height: 18px;
  stroke: rgba(255,255,255,0.7);
  stroke-width: 2;
  fill: none;
}

/* ===== FULLSCREEN MENU ===== */
.menu-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.97);
  backdrop-filter: blur(40px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.menu-overlay.active {
  opacity: 1;
  pointer-events: all;
}
.menu-overlay.active .menu-list li {
  opacity: 1;
  transform: translateY(0);
}
.menu-close {
  position: absolute;
  top: 28px; right: 48px;
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.menu-close:hover {
  background: rgba(255,255,255,0.12);
}
.menu-close svg {
  width: 18px; height: 18px;
  stroke: rgba(255,255,255,0.7);
  stroke-width: 2;
  fill: none;
}
.menu-list {
  list-style: none;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.menu-list li {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.menu-list li:nth-child(1) { transition-delay: 0.1s; }
.menu-list li:nth-child(2) { transition-delay: 0.2s; }
.menu-list li a {
  font-family: 'Figtree', sans-serif;
  font-size: 52px;
  font-weight: 800;
  color: rgba(255,255,255,0.2);
  text-decoration: none;
  transition: all 0.4s;
  display: inline-block;
  letter-spacing: -1.5px;
}
.menu-list li a:hover {
  color: #fff;
  letter-spacing: -1px;
}
.menu-list li .menu-sub {
  display: block;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: rgba(255,255,255,0.15);
  margin-top: 6px;
  letter-spacing: 1px;
}

/* ===== BACKGROUND ===== */
.bg-image {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0;
  background: url('images/hero-glass.jpg') center/cover no-repeat;
  opacity: 0.15;
  filter: grayscale(100%);
}
.bg-gradient {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0;
  overflow: hidden;
}
.bg-gradient::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.03) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 50%, rgba(255,255,255,0.02) 0%, transparent 50%);
  animation: bgShift 20s ease-in-out infinite alternate;
}
@keyframes bgShift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-5%, -3%); }
}
.bg-grid {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
}

/* ===== MAIN HERO ===== */
.main-hero {
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}
.main-hero-content {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 0 24px;
}

/* ===== STAGGERED ENTRANCE ANIMATIONS ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUpSubtle {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
.main-hero-content .main-logo {
  animation: fadeUp 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.1s both;
}
.main-hero-content .main-divider {
  animation: fadeUpSubtle 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.35s both;
}
.main-hero-content .main-tagline {
  animation: fadeUpSubtle 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.55s both;
}
.main-hero-content .main-services {
  animation: fadeUp 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.8s both;
}

.main-logo {
  width: 360px;
  max-width: 75%;
  height: auto;
  filter: brightness(0) invert(1);
  opacity: 0.95;
}
.main-divider {
  width: 40px;
  height: 1px;
  background: rgba(255,255,255,0.15);
  margin: 32px 0;
}
.main-tagline {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.3);
  letter-spacing: 4px;
  text-transform: uppercase;
}
.main-services {
  display: flex;
  gap: 16px;
  margin-top: 56px;
}

/* ===== SERVICE CARDS WITH SHIMMER ===== */
.main-service-link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 24px 32px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  text-decoration: none;
  color: #fff;
  background: rgba(255,255,255,0.03);
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  min-width: 280px;
}
.main-service-link::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent);
  opacity: 0;
  transition: opacity 0.5s;
}
/* Shimmer sweep effect */
.main-service-link::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,0.04) 30%,
    rgba(255,255,255,0.08) 50%,
    rgba(255,255,255,0.04) 70%,
    transparent 100%
  );
  transition: none;
  pointer-events: none;
}
.main-service-link:hover::after {
  animation: shimmerSweep 1.2s ease-in-out;
}
@keyframes shimmerSweep {
  0% { left: -100%; }
  100% { left: 150%; }
}
.main-service-link:hover::before {
  opacity: 1;
}
.main-service-link:hover {
  border-color: rgba(255,255,255,0.2);
  transform: translateY(-6px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 40px rgba(255,255,255,0.03);
}
.service-info {
  text-align: left;
  flex: 1;
}
.service-info .service-label {
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.2);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
  transition: color 0.4s;
}
.main-service-link:hover .service-label {
  color: rgba(255,255,255,0.5);
}
.service-info h3 {
  font-family: 'Figtree', sans-serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.service-info p {
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  margin-top: 4px;
}
.main-service-link .arrow {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.4s;
}
.main-service-link:hover .arrow {
  background: #fff;
  border-color: #fff;
}
.main-service-link:hover .arrow svg {
  stroke: #0a0a0a;
}
.main-service-link .arrow svg {
  width: 16px; height: 16px;
  stroke: rgba(255,255,255,0.4);
  stroke-width: 2;
  fill: none;
  transition: all 0.4s;
}

/* ===== SCROLL INDICATOR ===== */
.scroll-indicator {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  animation: fadeUpSubtle 0.8s 1.4s cubic-bezier(0.4, 0, 0.2, 1) both;
}
.scroll-indicator span {
  font-size: 10px;
  font-weight: 500;
  color: rgba(255,255,255,0.2);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.scroll-line {
  width: 1px;
  height: 36px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.25), transparent);
  position: relative;
  overflow: hidden;
}
.scroll-line::after {
  content: '';
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 50%;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.6), transparent);
  animation: scrollDrop 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}
@keyframes scrollDrop {
  0% { top: -50%; opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { top: 120%; opacity: 0; }
}

/* ===== BOTTOM ===== */
.bottom-info {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  text-align: center;
  z-index: 10;
  padding: 28px;
  background: linear-gradient(to top, rgba(10,10,10,0.8), transparent);
}
.bottom-info p {
  font-size: 12px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.5px;
}
.bottom-info a {
  color: rgba(255,255,255,0.35);
  text-decoration: none;
  transition: color 0.3s;
}
.bottom-info a:hover { color: rgba(255,255,255,0.7); }
.bottom-info .dot {
  display: inline-block;
  width: 3px; height: 3px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
  vertical-align: middle;
  margin: 0 12px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .nav { padding: 20px 20px; }
  .nav-logo img { height: 22px; }
  .nav-menu-btn { width: 42px; height: 42px; border-radius: 12px; }
  .menu-close { top: 20px; right: 20px; width: 42px; height: 42px; }
  .menu-list li a { font-size: 36px; }
  .menu-list li .menu-sub { font-size: 12px; }

  .main-logo { width: 240px; }
  .main-tagline { font-size: 11px; letter-spacing: 3px; }
  .main-services {
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 340px;
    margin-top: 40px;
  }
  .main-service-link {
    padding: 20px 24px;
    border-radius: 16px;
    min-width: 0;
    gap: 16px;
  }
  .service-info h3 { font-size: 17px; }
  .service-info p { font-size: 12px; }
  .main-service-link .arrow { width: 36px; height: 36px; }

  .bottom-info { padding: 20px; }

  .floating-dot:nth-child(3),
  .floating-dot:nth-child(5) { display: none; }
}

@media (max-width: 480px) {
  .main-logo { width: 180px; }
  .main-tagline { font-size: 10px; }
  .main-divider { margin: 24px 0; }
}
</style>
</head>
